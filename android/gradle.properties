org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Downgrade Kotlin JVM-target/Java mismatch from error to warning.
# Some Flutter plugins (e.g. speech_to_text 5.x) don't set a Kotlin jvmTarget so
# Kotlin 2.x running on JDK 21 defaults to JVM 21, mismatching their Java 1.8
# compileOptions.  The bytecode is correct; only the consistency check fires.
kotlin.jvm.target.validation.mode=warning
