name: scolar_ai_educative
description: "SCOLAR AI Educative - Assistant scolaire intelligent multi-cycles"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 📦 UI
  cupertino_icons: ^1.0.8

  # 🌐 HTTP
  http: ^1.2.1

  # 💾 STORAGE
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2

  # 📎 FILE PICKER
  file_picker: ^8.0.0

  # 🔗 URL LAUNCHER
  url_launcher: ^6.3.0

  # 🎤 VOIX
  flutter_tts: ^3.8.5

  # 📄 PDF
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2

  # 📷 IMAGE
  image_picker: ^1.0.7

  # 🔐 PERMISSIONS
  permission_handler: ^11.0.1

  # 🎙 AUDIO RECORDING & PLAYBACK
  record: ^5.0.4
  audioplayers: ^6.1.0

  # 🌍 INTERNATIONALISATION
  intl: ^0.19.0

  # 📊 UI EXTRA
  fl_chart: ^0.68.0

  # 🔥 FIREBASE
  firebase_core: ^2.30.0
  firebase_database: ^10.5.0
  firebase_auth: ^4.17.8
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.7.10
  cloud_firestore: ^4.17.2
  firebase_app_check: ^0.2.2+7

  # 📝 MARKDOWN
  flutter_markdown: ^0.7.0

  # 🔔 NOTIFICATIONS
  flutter_local_notifications: ^17.2.1

  # 🎤 VOICE INPUT
  speech_to_text: 5.6.1
  google_mlkit_text_recognition: ^0.16.0

dependency_overrides:
  speech_to_text:
    path: packages/speech_to_text
  # record_linux 0.7.2 is missing startStream from record_platform_interface 1.6.0.
  # record_linux 2.1.0 + record_platform_interface 2.1.0 form a consistent set.
  record_linux: 2.1.0
  record_platform_interface: 2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
